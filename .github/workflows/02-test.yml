name: python test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: check out
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: run test
        run: pytest -v